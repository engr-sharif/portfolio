name: CI

# Every pull request gets the same checks a deploy would run, plus the unit
# tests — so a broken build or a data-loss regression is caught before merge
# instead of on main.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type & template check
        run: npm run check

      - name: Build
        run: npm run build

      # Drive every page type in headless Chrome (preinstalled on the runner):
      # fails on CSP violations, console errors, reveals left invisible, or a
      # missing share card. Runs twice — once natively, once with scroll-driven
      # animations disabled to exercise the IntersectionObserver fallback.
      - name: Smoke test (native scroll-driven animations)
        run: npm run smoke
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      - name: Smoke test (fallback path, Lab theme)
        run: npm run smoke
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          SMOKE_NO_SDA: '1'
          SMOKE_THEME: light
      # The Studio must open with no signal (field log): one online visit, then
      # an offline reload must render from the service worker's cache.
      - name: Smoke test (Studio offline shell)
        run: npm run smoke:studio
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      # Drive the Studio end to end against its in-memory mock Worker: sign in,
      # ⌘K, drag-reorder, edit + save, history diff, bulk actions, field log.
      - name: Studio e2e (demo mode)
        run: npm run e2e:studio
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome

      # The Worker is deployed by copy-pasting worker.js into the Cloudflare
      # dashboard. Invisible control bytes do not survive that trip (a regex
      # written with literal \x00/\x1F once collapsed to "reject hyphens" in
      # production), so the file must be plain printable ASCII/UTF-8.
      - name: Guard — Worker source is paste-safe (no control bytes)
        run: |
          if LC_ALL=C grep -nP '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' studio-worker/worker.js; then
            echo "studio-worker/worker.js contains control bytes" && exit 1
          fi

      - name: Guard — no admin leftovers
        run: |
          test ! -e public/admin || (echo "public/admin must not exist" && exit 1)
          test ! -e cms-oauth-worker || (echo "cms-oauth-worker must not exist" && exit 1)
