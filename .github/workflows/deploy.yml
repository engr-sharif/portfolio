name: GitHub Pages redirect

# The site is now built and hosted by Cloudflare Pages (https://mosharif.pages.dev,
# connected directly to this repo). The old GitHub Pages address keeps working
# as a redirect so every existing link, QR code and search result still lands.
# This only needs to run when the redirect itself changes.
on:
  push:
    branches: [main]
    paths:
      - scripts/redirect-site.mjs
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build redirect pages
        run: node scripts/redirect-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
